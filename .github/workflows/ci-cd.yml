name: CI

# Lint, testes e build em PRs e pushes para homolog/production.
# O deploy é feito pelo Railway, que observa as branches diretamente.
on:
  push:
    branches: [homolog, production]
  pull_request:
    branches: [homolog, production]

jobs:
  build-and-test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build
        run: npm run build

